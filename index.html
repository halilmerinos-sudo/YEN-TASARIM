<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>NAVİMEX PRO V01 · GPS Takip</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
  :root{--bg:#0a0e16;--panel:#111826;--panel2:#0c1420;--txt:#e8eef7;--mut:#8ea0b8;--accent:#00b4ff;--accent2:#00e0a8;--ok:#22e08a;--warn:#ff3b3b;--bd:#1e2740;}
  *{box-sizing:border-box;margin:0;padding:0;font-family:'Segoe UI',system-ui,Arial,sans-serif;}
  html,body{height:100%;background:var(--bg);color:var(--txt);}
  body{display:flex;flex-direction:column;height:100vh;overflow:hidden;}
  .topbar{height:54px;display:flex;align-items:center;justify-content:space-between;padding:0 18px;background:#0c111c;border-bottom:1px solid var(--bd);flex-shrink:0;}
  .logo{font-size:18px;font-weight:800;color:var(--accent);letter-spacing:1px;}
  .logo small{color:var(--mut);font-weight:400;font-size:10px;letter-spacing:2px;display:block;line-height:1;}
  .status{display:flex;align-items:center;gap:16px;font-size:13px;color:var(--mut);}
  .stat{display:flex;align-items:center;gap:6px;white-space:nowrap;}
  .dot{width:10px;height:10px;border-radius:50%;background:#455;transition:.3s;}
  .dot.on{background:var(--ok);box-shadow:0 0 10px var(--ok);}
  .wrap{flex:1;display:flex;min-height:0;}
  #map{flex:1;min-width:0;background:#0c1420;}
  .side{width:380px;max-width:42vw;display:flex;flex-direction:column;border-left:1px solid var(--bd);background:var(--panel);}
  .cards{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:14px;}
  .card{background:var(--panel2);border:1px solid var(--bd);border-radius:14px;padding:12px;}
  .card .lbl{font-size:11px;color:var(--mut);text-transform:uppercase;letter-spacing:.5px;}
  .card .val{font-size:22px;font-weight:800;margin-top:4px;}
  .card .val small{font-size:12px;color:var(--mut);font-weight:500;}
  .card.wide{grid-column:1/3;}
  .btns{display:flex;gap:8px;padding:0 14px 12px;}
  .btn{flex:1;padding:11px;border-radius:12px;border:none;font-size:13px;font-weight:700;cursor:pointer;background:var(--panel2);color:var(--txt);border:1px solid var(--bd);}
  .btn.pri{background:linear-gradient(135deg,var(--accent2),var(--accent));color:#03121b;border:none;}
  .btn.dng{color:var(--warn);}
  .btn:active{transform:scale(.97);}
  .tblhead{padding:8px 14px;font-size:12px;color:var(--mut);text-transform:uppercase;letter-spacing:.5px;display:flex;justify-content:space-between;align-items:center;}
  .tblwrap{flex:1;overflow:auto;-webkit-overflow-scrolling:touch;padding:0 14px 14px;}
  table{width:100%;border-collapse:collapse;font-size:12px;}
  th,td{padding:7px 6px;text-align:left;border-bottom:1px solid var(--bd);white-space:nowrap;}
  th{position:sticky;top:0;background:var(--panel);color:var(--mut);font-size:10px;text-transform:uppercase;letter-spacing:.5px;}
  td{color:var(--txt);}
  tr:hover td{background:rgba(0,180,255,.06);}
  .empty{color:var(--mut);text-align:center;padding:24px 0;font-size:13px;}
  @media(max-width:820px){.wrap{flex-direction:column;}.side{width:100%;max-width:100%;height:52%;border-left:none;border-top:1px solid var(--bd);}#map{height:48%;}}
</style>
</head>
<body>
  <div class="topbar">
    <div class="logo">NAVİMEX PRO V01<small>GPS TAKİP · HALİL KILIÇ</small></div>
    <div class="status">
      <div class="stat"><span class="dot" id="dot-gps"></span>GPS</div>
      <div class="stat"><span class="dot" id="dot-net"></span><span id="nettxt">İNTERNET</span></div>
      <div class="stat" id="clock">--:--:--</div>
    </div>
  </div>
  <div class="wrap">
    <div id="map"></div>
    <div class="side">
      <div class="cards">
        <div class="card"><div class="lbl">Enlem</div><div class="val" id="v-lat">--</div></div>
        <div class="card"><div class="lbl">Boylam</div><div class="val" id="v-lon">--</div></div>
        <div class="card"><div class="lbl">Hız</div><div class="val" id="v-spd">0 <small>km/s</small></div></div>
        <div class="card"><div class="lbl">Doğruluk</div><div class="val" id="v-acc">-- <small>m</small></div></div>
        <div class="card wide"><div class="lbl">Konum</div><div class="val" id="v-loc" style="font-size:16px">Konum bekleniyor...</div></div>
      </div>
      <div class="btns">
        <button class="btn pri" id="btn-toggle" onclick="toggleLog()">▶ Kaydı Başlat</button>
        <button class="btn" onclick="exportCSV()">⬇ CSV</button>
        <button class="btn dng" onclick="clearLog()">🗑 Temizle</button>
      </div>
      <div class="tblhead"><span>Kayıt Tablosu</span><span id="count">0 kayıt</span></div>
      <div class="tblwrap">
        <table>
          <thead><tr><th>#</th><th>Saat</th><th>Enlem</th><th>Boylam</th><th>Hız</th><th>±m</th></tr></thead>
          <tbody id="tbody"><tr><td colspan="6" class="empty">Henüz kayıt yok. “Kaydı Başlat” ile gerçek GPS verisini toplamaya başlayın.</td></tr></tbody>
        </table>
      </div>
    </div>
  </div>
<script>
// ================= NAVİMEX PRO V01 – GPS Takip (Yapımcı: HALİL KILIÇ) =================
const REFRESH_MS=3000;              // her 3 saniyede bir yenile
let map,marker,accCircle,trail;
let trailPts=[];
let logging=false;
let log=[];                          // kayıt tablosu verisi
let lastFix=null;                    // en son gerçek GPS ölçümü
let mapReady=false;

// ---- Harita kurulumu (Leaflet + OpenStreetMap) ----
function initMap(lat,lon){
  map=L.map('map',{zoomControl:true,attributionControl:true}).setView([lat,lon],16);
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'© OpenStreetMap'}).addTo(map);
  marker=L.circleMarker([lat,lon],{radius:9,color:'#03121b',weight:3,fillColor:'#00e0a8',fillOpacity:1}).addTo(map);
  accCircle=L.circle([lat,lon],{radius:20,color:'#00b4ff',weight:1,fillColor:'#00b4ff',fillOpacity:.12}).addTo(map);
  trail=L.polyline([],{color:'#00b4ff',weight:4,opacity:.8}).addTo(map);
  mapReady=true;
}

// ---- Gerçek GPS ölçümü geldiğinde ----
function onGeo(p){
  const c=p.coords;
  const lat=c.latitude,lon=c.longitude;
  const kmh=Math.max(0,Math.round((c.speed||0)*3.6));
  const acc=Math.round(c.accuracy||0);
  lastFix={lat:lat,lon:lon,kmh:kmh,acc:acc,t:new Date()};

  document.getElementById('dot-gps').classList.add('on');
  document.getElementById('v-lat').textContent=lat.toFixed(6);
  document.getElementById('v-lon').textContent=lon.toFixed(6);
  document.getElementById('v-spd').innerHTML=kmh+' <small>km/s</small>';
  document.getElementById('v-acc').innerHTML=acc+' <small>m</small>';

  if(!mapReady){initMap(lat,lon);}
  else{
    marker.setLatLng([lat,lon]);
    accCircle.setLatLng([lat,lon]).setRadius(Math.max(acc,5));
    map.panTo([lat,lon],{animate:true,duration:.6});
  }
  // iz çizgisi
  trailPts.push([lat,lon]);
  if(trailPts.length>500)trailPts.shift();
  if(trail)trail.setLatLngs(trailPts);
}

function onGeoErr(e){
  document.getElementById('dot-gps').classList.remove('on');
  const el=document.getElementById('v-loc');
  el.textContent=e.code===1?'Konum izni reddedildi':(e.code===3?'Konum zaman aşımı':'Konum alınamıyor');
}

// ---- Gerçek zamanlı: her 3 saniyede bir taze konum iste ----
function requestFix(){
  if(!navigator.geolocation)return;
  navigator.geolocation.getCurrentPosition(onGeo,onGeoErr,{enableHighAccuracy:true,maximumAge:0,timeout:10000});
}
if(navigator.geolocation){
  // anında + sürekli izleme (hareket) + 3 sn zorunlu tazeleme
  navigator.geolocation.watchPosition(onGeo,onGeoErr,{enableHighAccuracy:true,maximumAge:0,timeout:20000});
  requestFix();
  setInterval(requestFix,REFRESH_MS);
}else{
  onGeoErr({code:2});
}

// ---- Kayıt tablosu: her 3 sn'de son gerçek konumu tabloya işle ----
setInterval(function(){
  if(!logging||!lastFix)return;
  addRow(lastFix);
},REFRESH_MS);

function addRow(f){
  const t=f.t.toLocaleTimeString('tr-TR',{hour:'2-digit',minute:'2-digit',second:'2-digit'});
  log.push({t:t,lat:f.lat,lon:f.lon,kmh:f.kmh,acc:f.acc});
  renderTable();
}
function renderTable(){
  const tb=document.getElementById('tbody');
  document.getElementById('count').textContent=log.length+' kayıt';
  if(!log.length){tb.innerHTML='<tr><td colspan="6" class="empty">Henüz kayıt yok.</td></tr>';return;}
  const rows=log.slice(-200).map((r,i)=>{
    const idx=log.length-Math.min(log.length,200)+i+1;
    return '<tr><td>'+idx+'</td><td>'+r.t+'</td><td>'+r.lat.toFixed(6)+'</td><td>'+r.lon.toFixed(6)+'</td><td>'+r.kmh+'</td><td>'+r.acc+'</td></tr>';
  }).reverse().join('');
  tb.innerHTML=rows;
  const w=document.querySelector('.tblwrap');w.scrollTop=0;
}

function toggleLog(){
  logging=!logging;
  const b=document.getElementById('btn-toggle');
  b.textContent=logging?'⏸ Kaydı Durdur':'▶ Kaydı Başlat';
  b.style.background=logging?'linear-gradient(135deg,#ff6a6a,#c81d1d)':'';
  b.style.color=logging?'#fff':'';
  if(logging&&lastFix)addRow(lastFix);
}
function clearLog(){
  if(log.length&&!confirm('Tüm kayıtlar silinsin mi?'))return;
  log=[];renderTable();
}
function exportCSV(){
  if(!log.length){alert('Kaydedilecek veri yok. Önce kaydı başlatın.');return;}
  let csv='no,saat,enlem,boylam,hiz_kmh,dogruluk_m\n';
  log.forEach((r,i)=>{csv+=(i+1)+','+r.t+','+r.lat.toFixed(6)+','+r.lon.toFixed(6)+','+r.kmh+','+r.acc+'\n';});
  const blob=new Blob(['\ufeff'+csv],{type:'text/csv;charset=utf-8;'});
  const a=document.createElement('a');
  a.href=URL.createObjectURL(blob);
  a.download='navimex_gps_'+new Date().toISOString().slice(0,19).replace(/[:T]/g,'-')+'.csv';
  document.body.appendChild(a);a.click();a.remove();
}

// ---- Konum adı (reverse geocode) – 30 sn'de bir ----
let lastGeo=0;
setInterval(function(){
  if(!lastFix||Date.now()-lastGeo<30000)return;
  lastGeo=Date.now();
  fetch('https://api.bigdatacloud.net/data/reverse-geocode-client?latitude='+lastFix.lat+'&longitude='+lastFix.lon+'&localityLanguage=tr')
    .then(r=>r.json()).then(d=>{
      const parts=[d.locality||d.city,d.principalSubdivision,d.countryName].filter(Boolean);
      const el=document.getElementById('v-loc');if(parts.length)el.textContent=parts.join(', ');
    }).catch(()=>{});
},3000);

// ---- İnternet & saat ----
function updateNet(){
  const on=navigator.onLine;
  const d=document.getElementById('dot-net');d.classList.toggle('on',on);
  document.getElementById('nettxt').textContent=on?'BAĞLANDI':'BAĞLANTI YOK';
}
updateNet();
window.addEventListener('online',updateNet);
window.addEventListener('offline',updateNet);
setInterval(function(){
  document.getElementById('clock').textContent=new Date().toLocaleTimeString('tr-TR');
},1000);
</script>
</body>
</html>
